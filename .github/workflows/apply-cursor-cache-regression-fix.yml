name: Apply Cursor Cache Regression Fix

on:
  push:
    branches:
      - fix/remove-production-mock-fallbacks
    paths:
      - tools/apply_cursor_cache_regression_fix.py
      - .github/workflows/apply-cursor-cache-regression-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/remove-production-mock-fallbacks
          fetch-depth: 0
      - name: Apply regression repair
        run: python3 tools/apply_cursor_cache_regression_fix.py
      - name: Install source-contract dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input Pillow==11.3.0
      - name: Run all source regression contracts
        run: python3 tools/tests/run_contract_tests.py
      - name: Commit production source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-integration-bot"
          git config user.email "chatgpt-integration-bot@users.noreply.github.com"
          git add app/src/main/java/za/org/rtc/community/feature/community/SupabaseCommunityRepository.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source change produced; refusing silent success."
            exit 1
          fi
          git commit -m "fix(community): restore cursor-aware verified cache fallback"
          git push origin HEAD:fix/remove-production-mock-fallbacks
