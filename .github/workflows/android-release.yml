name: Android Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-production-release
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '8.13'

jobs:
  release:
    name: Verify and build signed production artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RTC_PROD_SUPABASE_URL: ${{ secrets.RTC_PROD_SUPABASE_URL }}
      RTC_PROD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.RTC_PROD_SUPABASE_PUBLISHABLE_KEY }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      RTC_ANDROID_KEYSTORE_BASE64: ${{ secrets.RTC_ANDROID_KEYSTORE_BASE64 }}
      RTC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RTC_ANDROID_KEYSTORE_PASSWORD }}
      RTC_ANDROID_KEY_ALIAS: ${{ secrets.RTC_ANDROID_KEY_ALIAS }}
      RTC_ANDROID_KEY_PASSWORD: ${{ secrets.RTC_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Enforce main-only release and complete secret bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production releases may only be built from main."
            exit 1
          fi

          required=(
            RTC_PROD_SUPABASE_URL
            RTC_PROD_SUPABASE_PUBLISHABLE_KEY
            GOOGLE_SERVICES_JSON_BASE64
            RTC_ANDROID_KEYSTORE_BASE64
            RTC_ANDROID_KEYSTORE_PASSWORD
            RTC_ANDROID_KEY_ALIAS
            RTC_ANDROID_KEY_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Production release is fail-closed. Missing required secret names: ${missing[*]}"
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install source-contract Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input Pillow==11.3.0

      - name: Reconstruct production configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          {
            printf 'supabase.production.url=%s\n' "$RTC_PROD_SUPABASE_URL"
            printf 'supabase.production.publishableKey=%s\n' "$RTC_PROD_SUPABASE_PUBLISHABLE_KEY"
          } > release.runtime.properties

          {
            printf 'storeFile=%s\n' 'rtc-ci-release.keystore'
            printf 'storePassword=%s\n' "$RTC_ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$RTC_ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$RTC_ANDROID_KEY_PASSWORD"
          } > signing.properties

          printf '%s' "$RTC_ANDROID_KEYSTORE_BASE64" | base64 --decode > rtc-ci-release.keystore
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

          test -s rtc-ci-release.keystore
          test -s app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("app/google-services.json").read_text(encoding="utf-8"))
          clients = payload.get("client", [])
          packages = {
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in clients
          }
          if "za.org.rtc.community" not in packages:
              raise SystemExit("Firebase configuration does not contain za.org.rtc.community")
          PY

          {
            printf 'supabase.nonproduction.url=%s\n' 'https://rtc-release-verification.invalid'
            printf 'supabase.nonproduction.publishableKey=%s\n' 'sb_publishable_release_verification_placeholder'
          } > runtime.local.properties

      - name: Run source regression contracts
        run: python3 tools/tests/run_contract_tests.py

      - name: Run shared Edge authorization tests
        run: deno test supabase/functions/_shared/auth_test.ts

      - name: Run JVM unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Compile Compose smoke tests
        run: gradle --no-daemon --stacktrace assembleDebugAndroidTest

      - name: Build phone beta and signed release artifacts
        run: gradle --no-daemon --stacktrace assemblePhoneBeta assembleRelease bundleRelease

      - name: Verify and checksum release outputs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          phone_beta=(app/build/outputs/apk/phoneBeta/*.apk)
          release_apks=(app/build/outputs/apk/release/*.apk)
          release_bundles=(app/build/outputs/bundle/release/*.aab)

          if [ "${#phone_beta[@]}" -eq 0 ] || [ "${#release_apks[@]}" -eq 0 ] || [ "${#release_bundles[@]}" -eq 0 ]; then
            echo "::error::Expected phoneBeta APK, signed release APK, and release AAB were not all produced."
            exit 1
          fi

          mkdir -p app/build/outputs/production-release
          cp "${phone_beta[@]}" "${release_apks[@]}" "${release_bundles[@]}" app/build/outputs/production-release/
          printf '%s\n' "$GITHUB_SHA" > app/build/outputs/production-release/BUILD_COMMIT.txt
          (
            cd app/build/outputs/production-release
            sha256sum -- * > SHA256SUMS.txt
          )

      - name: Upload production release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rtc-community-production-release-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/production-release/*.apk
            app/build/outputs/production-release/*.aab
            app/build/outputs/production-release/BUILD_COMMIT.txt
            app/build/outputs/production-release/SHA256SUMS.txt

      - name: Cleanup reconstructed credentials
        if: always()
        shell: bash
        run: |
          rm -f \
            runtime.local.properties \
            release.runtime.properties \
            signing.properties \
            rtc-ci-release.keystore \
            app/google-services.json
