name: ChatGPT Production Truth Boundary Fix

on:
  push:
    branches:
      - fix/remove-production-mock-fallbacks
    paths:
      - tools/chatgpt_apply_production_fix.py
      - .github/workflows/chatgpt-production-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/remove-production-mock-fallbacks
          fetch-depth: 0

      - name: Apply deterministic production patch
        run: python3 tools/chatgpt_apply_production_fix.py

      - name: Install source-contract test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify production truth-boundary contract
        run: python -m pytest -q tools/tests/test_production_no_mock_fallback_contract.py

      - name: Commit patched production sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-integration-bot"
          git config user.email "chatgpt-integration-bot@users.noreply.github.com"
          git add app/src/main/java/za/org/rtc/community/feature/community/SupabaseCommunityRepository.kt app/src/main/java/za/org/rtc/community/data/RtcRepository.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes produced; refusing silent success."
            exit 1
          fi
          git commit -m "fix(prod): complete authoritative community and MFA boundaries"
          git push origin HEAD:fix/remove-production-mock-fallbacks
