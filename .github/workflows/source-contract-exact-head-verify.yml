name: Source Contract Exact Head Verification

on:
  push:
    branches:
      - verify/main-source-contract-gate-3

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install source-contract dependencies
        run: python -m pip install --disable-pip-version-check pytest pillow
      - name: Run complete source regression contracts
        run: python -m pytest tools/tests -q
