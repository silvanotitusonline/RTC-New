name: Truth Boundary Integration Verification

on:
  push:
    branches:
      - integration/truth-boundary-consistency
      - integration/anonymous-resident-runtime
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '8.13'

jobs:
  verify-truth-boundary:
    name: Compile truth-boundary integration
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Restore isolated compile runtime
        env:
          RTC_NONPROD_SUPABASE_URL: ${{ secrets.RTC_NONPROD_SUPABASE_URL }}
          RTC_NONPROD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.RTC_NONPROD_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          if [ -z "$RTC_NONPROD_SUPABASE_URL" ] || [ -z "$RTC_NONPROD_SUPABASE_PUBLISHABLE_KEY" ]; then
            RTC_NONPROD_SUPABASE_URL="https://rtc-ci.invalid"
            RTC_NONPROD_SUPABASE_PUBLISHABLE_KEY="sb_publishable_ci_placeholder"
          fi
          umask 077
          {
            printf 'supabase.nonproduction.url=%s\n' "$RTC_NONPROD_SUPABASE_URL"
            printf 'supabase.nonproduction.publishableKey=%s\n' "$RTC_NONPROD_SUPABASE_PUBLISHABLE_KEY"
          } > runtime.local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install source-contract dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input Pillow==11.3.0 pytest==8.4.2

      - name: Verify anonymous resident trust contracts
        run: python3 -m pytest -q tools/tests/test_anonymous_resident_runtime.py tools/tests/test_truth_boundary_consistency.py

      - name: Record legacy source-contract state without blocking compile verification
        continue-on-error: true
        run: python3 tools/tests/run_contract_tests.py

      - name: Run shared Edge authorization tests
        run: deno test supabase/functions/_shared/auth_test.ts

      - name: Run JVM unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Compile Android instrumentation tests
        run: gradle --no-daemon --stacktrace assembleDebugAndroidTest

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtc-truth-boundary-verification
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/**

      - name: Cleanup CI runtime
        if: always()
        run: rm -f runtime.local.properties app/google-services.json
