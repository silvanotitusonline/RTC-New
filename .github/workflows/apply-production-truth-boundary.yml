name: Apply Production Truth Boundary Patch

on:
  push:
    branches:
      - fix/remove-production-mock-fallbacks
    paths:
      - tools/apply_production_truth_boundary_followup.py
      - .github/workflows/apply-production-truth-boundary.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/remove-production-mock-fallbacks
          fetch-depth: 0

      - name: Apply deterministic follow-up patch
        run: python3 tools/apply_production_truth_boundary_followup.py

      - name: Commit patched production sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rtc-production-bot"
          git config user.email "rtc-production-bot@users.noreply.github.com"
          git add app/src/main/java/za/org/rtc/community/data/RtcRepository.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes produced; refusing silent success."
            exit 1
          fi
          git commit -m "fix(prod): close remaining local-success truth gaps"
          git push origin HEAD:fix/remove-production-mock-fallbacks
