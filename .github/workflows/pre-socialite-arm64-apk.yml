name: Pre-Socialite ARM64 APK

on:
  push:
    branches: [ 'integration/pre-socialite-arm64-apk' ]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '8.13'

jobs:
  build-arm64-apk:
    name: Build historical ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Verify historical base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e074a44d6929bc789a7130e162d55ff47e8093cb HEAD
          git diff --exit-code e074a44d6929bc789a7130e162d55ff47e8093cb -- ':!/.github/workflows/pre-socialite-arm64-apk.yml'

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Restore isolated debug runtime
        env:
          RTC_NONPROD_SUPABASE_URL: ${{ secrets.RTC_NONPROD_SUPABASE_URL }}
          RTC_NONPROD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.RTC_NONPROD_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          if [ -z "$RTC_NONPROD_SUPABASE_URL" ] || [ -z "$RTC_NONPROD_SUPABASE_PUBLISHABLE_KEY" ]; then
            RTC_NONPROD_SUPABASE_URL="https://rtc-ci.invalid"
            RTC_NONPROD_SUPABASE_PUBLISHABLE_KEY="sb_publishable_ci_placeholder"
          fi
          umask 077
          {
            printf 'supabase.nonproduction.url=%s\n' "$RTC_NONPROD_SUPABASE_URL"
            printf 'supabase.nonproduction.publishableKey=%s\n' "$RTC_NONPROD_SUPABASE_PUBLISHABLE_KEY"
          } > runtime.local.properties

      - name: Restore Firebase Android configuration when supplied
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            umask 077
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Restrict packaging to ARM64 for this build only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          source = path.read_text()
          old = 'ndk { abiFilters += listOf("arm64-v8a", "x86_64") }'
          new = 'ndk { abiFilters += listOf("arm64-v8a") }'
          if source.count(old) != 1:
              raise SystemExit('Expected historical ABI filter was not found exactly once.')
          path.write_text(source.replace(old, new))
          PY

      - name: Assemble ARM64 debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK ABI and size
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libtomtom-navsdk.so'
          if unzip -l "$APK" | grep -q 'lib/x86_64/'; then
            echo '::error::x86_64 native libraries are still packaged.'
            exit 1
          fi
          SIZE=$(stat -c '%s' "$APK")
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          printf 'APK_SIZE_BYTES=%s\nAPK_SHA256=%s\n' "$SIZE" "$SHA" | tee arm64-apk-metadata.txt

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v6
        with:
          name: rtc-pre-socialite-arm64-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            arm64-apk-metadata.txt
