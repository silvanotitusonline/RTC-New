name: Kotlin Express Remediation Verification
on:
  push:
    branches: [ implementation/android-node-remediation ]
  pull_request:
    paths:
      - 'implementation/rtc-production-remediation/**'
      - '.github/workflows/android-node-remediation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Compile, unit-test and lint the Kotlin/Compose integration library
        run: gradle -p implementation/rtc-production-remediation/android --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rtc-remediation-kotlin-library
          path: |
            implementation/rtc-production-remediation/android/build/outputs/aar/*.aar
            implementation/rtc-production-remediation/android/build/reports/**
          if-no-files-found: warn
  express:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rtc_test
          POSTGRES_PASSWORD: rtc_test_disposable
          POSTGRES_DB: rtc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rtc_test -d rtc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://rtc_test:rtc_test_disposable@localhost:5432/rtc_test
    timeout-minutes: 10
    defaults:
      run:
        working-directory: implementation/rtc-production-remediation/server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
