name: Pre-Socialite ARM64 Logout Release

on:
  push:
    branches: [ 'release/pre-socialite-arm64-logout' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  RELEASE_TAG: 'pre-socialite-arm64-logout'
  APK_NAME: 'RTC-New-Pre-Socialite-ARM64-Logout-debug.apk'

jobs:
  verify-build-release:
    name: Verify, build ARM64 APK, publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify historical base and bounded changes
        shell: bash
        run: |
          set -euo pipefail
          BASE=e074a44d6929bc789a7130e162d55ff47e8093cb
          git merge-base --is-ancestor "$BASE" HEAD
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"
          printf '%s\n' "$CHANGED"
          while IFS= read -r path; do
            case "$path" in
              app/src/main/java/za/org/rtc/community/feature/account/AccountScreen.kt|tools/tests/test_account_logout_contract.py|.github/workflows/pre-socialite-arm64-logout-release.yml) ;;
              '') ;;
              *) echo "::error::Unexpected change outside bounded recovery set: $path"; exit 1 ;;
            esac
          done <<< "$CHANGED"

      - name: Install contract test dependency
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Verify Account-menu logout contract
        run: python3 -m pytest -q tools/tests/test_account_logout_contract.py

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Restore isolated debug runtime
        env:
          RTC_NONPROD_SUPABASE_URL: ${{ secrets.RTC_NONPROD_SUPABASE_URL }}
          RTC_NONPROD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.RTC_NONPROD_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          if [ -z "$RTC_NONPROD_SUPABASE_URL" ] || [ -z "$RTC_NONPROD_SUPABASE_PUBLISHABLE_KEY" ]; then
            RTC_NONPROD_SUPABASE_URL="https://rtc-ci.invalid"
            RTC_NONPROD_SUPABASE_PUBLISHABLE_KEY="sb_publishable_ci_placeholder"
          fi
          umask 077
          {
            printf 'supabase.nonproduction.url=%s\n' "$RTC_NONPROD_SUPABASE_URL"
            printf 'supabase.nonproduction.publishableKey=%s\n' "$RTC_NONPROD_SUPABASE_PUBLISHABLE_KEY"
          } > runtime.local.properties

      - name: Restore Firebase Android configuration when supplied
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            umask 077
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Restrict packaging to ARM64 for this build only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          source = path.read_text()
          old = 'ndk { abiFilters += listOf("arm64-v8a", "x86_64") }'
          new = 'ndk { abiFilters += listOf("arm64-v8a") }'
          if source.count(old) != 1:
              raise SystemExit('Expected historical ABI filter was not found exactly once.')
          path.write_text(source.replace(old, new))
          PY

      - name: Assemble ARM64 debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK ABI, checksum and size
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SOURCE_APK"
          unzip -l "$SOURCE_APK" | grep -q 'lib/arm64-v8a/libtomtom-navsdk.so'
          if unzip -l "$SOURCE_APK" | grep -q 'lib/x86_64/'; then
            echo '::error::x86_64 native libraries are still packaged.'
            exit 1
          fi
          cp "$SOURCE_APK" "$APK_NAME"
          SIZE=$(stat -c '%s' "$APK_NAME")
          SHA=$(sha256sum "$APK_NAME" | awk '{print $1}')
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          printf 'APK_SIZE_BYTES=%s\nAPK_SHA256=%s\n' "$SIZE" "$SHA" | tee apk-metadata.txt

      - name: Publish direct APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          APK_SHA: ${{ steps.apk.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG" "$APK_NAME" apk-metadata.txt \
            --target "$GITHUB_SHA" \
            --title "RTC-New Pre-Socialite ARM64 + Logout" \
            --notes "Recovered pre-socialite Android client with one bounded UI addition: a confirmed, working Log out action at the bottom of the fifth Account menu. ARM64-only native packaging retains TomTom navigation on modern ARM64 phones and excludes x86_64 emulator binaries. Debug-signed verification build. APK SHA-256: $APK_SHA. Size: $APK_SIZE bytes." \
            --prerelease

      - name: Upload workflow artifact backup
        uses: actions/upload-artifact@v6
        with:
          name: rtc-pre-socialite-arm64-logout-debug
          if-no-files-found: error
          path: |
            ${{ env.APK_NAME }}
            apk-metadata.txt
