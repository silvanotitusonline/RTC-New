name: Apply auth authority patch

on:
  push:
    branches:
      - fix/auth-signup-authority-boundary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/auth-signup-authority-boundary
          fetch-depth: 0
      - name: Apply server-authoritative signup correction
        run: python3 tools/apply_auth_signup_authority_patch.py
      - name: Commit product fix and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/auth-signup-authority-patch.yml tools/apply_auth_signup_authority_patch.py
          git add app/src/main/java/za/org/rtc/community/data/RtcRepository.kt
          git commit -m "fix(auth): require Supabase authority before local session"
          git push origin HEAD:fix/auth-signup-authority-boundary
