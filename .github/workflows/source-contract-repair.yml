name: Source Contract Repair

on:
  push:
    branches:
      - fix/main-source-contract-gate

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install source-contract dependencies
        run: python -m pip install --disable-pip-version-check pytest pillow
      - name: Apply production repair
        run: |
          python tools/apply_main_source_contract_repair.py
          python tools/apply_main_source_contract_repair_followup.py
      - name: Run complete source regression contracts
        run: python -m pytest tools/tests -q
      - name: Commit verified repair
        run: |
          rm -f .github/workflows/source-contract-repair.yml
          git config user.name "rtc-ci-repair"
          git config user.email "rtc-ci-repair@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): reconcile production source contracts"
          git push origin HEAD:fix/main-source-contract-gate
