name: Production Compile Gate Verification

on:
  push:
    branches:
      - verify/production-compile-gate-4

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  compile-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v4
      - name: Install SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Restore compile-only runtime
        shell: bash
        run: |
          umask 077
          printf 'supabase.nonproduction.url=%s\n' 'https://rtc-ci.invalid' > runtime.local.properties
          printf 'supabase.nonproduction.publishableKey=%s\n' 'sb_publishable_ci_placeholder' >> runtime.local.properties
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Compile debug Kotlin
        run: gradle --no-daemon --stacktrace compileDebugKotlin
      - name: Run debug unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Cleanup
        if: always()
        run: rm -f runtime.local.properties app/google-services.json
