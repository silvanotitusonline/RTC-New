name: Community Authoritative Mutation Verification

on:
  push:
    branches:
      - verify/community-authoritative-mutations-ci

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  verify-community-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Restore compile-only debug runtime
        shell: bash
        run: |
          umask 077
          {
            printf 'supabase.nonproduction.url=%s\n' 'https://rtc-ci.invalid'
            printf 'supabase.nonproduction.publishableKey=%s\n' 'sb_publishable_ci_placeholder'
          } > runtime.local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run JVM unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Cleanup runtime material
        if: always()
        run: rm -f runtime.local.properties app/google-services.json
